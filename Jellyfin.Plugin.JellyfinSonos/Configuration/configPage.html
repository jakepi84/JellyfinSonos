<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jellyfin Sonos</title>
</head>
<body>
<div data-role="page" class="page type-interior pluginConfigurationPage esqConfigurationPage">
    <div data-role="content">
        <div class="content-primary">
            <form class="esqConfigurationForm">
                <div class="verticalSection verticalSection-extrabottompadding">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">Jellyfin Sonos Settings</h2>
                    </div>
                    <div class="verticalSection verticalSection-extrabottompadding">
                        <div class="inputContainer">
                            <input is="emby-input" type="text" id="txtServiceName" label="Service Name:" />
                            <div class="fieldDescription">The name displayed in your Sonos app.</div>
                        </div>
                    </div>
                    <div class="verticalSection verticalSection-extrabottompadding">
                        <div class="inputContainer">
                            <input is="emby-input" type="number" id="txtServiceId" label="Service ID:" />
                            <div class="fieldDescription">Unique service ID (default: 247).</div>
                        </div>
                    </div>
                    <div class="verticalSection verticalSection-extrabottompadding">
                        <div class="inputContainer">
                            <input is="emby-input" type="text" id="txtExternalUrl" label="External URL:" />
                            <div class="fieldDescription">The external URL for your Jellyfin server (e.g., https://jellyfin.jakepi.net).</div>
                        </div>
                    </div>
                    <div class="verticalSection verticalSection-extrabottompadding">
                        <div class="inputContainer">
                            <input is="emby-input" type="password" id="txtSecretKey" label="Secret Key:" autocomplete="current-password" />
                            <div class="fieldDescription">Secret key used to sign OAuth tokens (generate a random 32+ character string).</div>
                        </div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" data-theme="b" class="raised button-submit block">
                            <span>${Save}</span>
                        </button>
                        <button is="emby-button" type="button" class="raised button-cancel block btnCancel" onclick="history.back();">
                            <span>${ButtonCancel}</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        var JellyfinSonosConfigurationPage = {
            pluginUniqueId: "a8c8f6d4-3b2e-4f1a-9c7d-8e5f6a7b8c9d",

            txtServiceName: document.querySelector("#txtServiceName"),
            txtServiceId: document.querySelector("#txtServiceId"),
            txtExternalUrl: document.querySelector("#txtExternalUrl"),
            txtSecretKey: document.querySelector("#txtSecretKey")
        };

        window.addEventListener("pageshow", function (_) {
            Dashboard.showLoadingMsg();
            console.log('[JellyfinSonos] pageshow');
            window.ApiClient.getPluginConfiguration(JellyfinSonosConfigurationPage.pluginUniqueId).then(function (config) {
                console.log('[JellyfinSonos] config loaded:', config);
                JellyfinSonosConfigurationPage.txtServiceName.value = config.ServiceName || "Jellyfin";
                JellyfinSonosConfigurationPage.txtServiceId.value = config.ServiceId || "247";
                JellyfinSonosConfigurationPage.txtExternalUrl.value = config.ExternalUrl || "";
                JellyfinSonosConfigurationPage.txtSecretKey.value = config.SecretKey || "";
                Dashboard.hideLoadingMsg();
            });
        });

        document.querySelector(".esqConfigurationForm").addEventListener("submit", function(e){
            e.preventDefault();
            Dashboard.showLoadingMsg();
            console.log('[JellyfinSonos] submit');

            window.ApiClient.getPluginConfiguration(JellyfinSonosConfigurationPage.pluginUniqueId).then(function (config) {
                config.ServiceName = JellyfinSonosConfigurationPage.txtServiceName.value || "Jellyfin";
                config.ServiceId = parseInt(JellyfinSonosConfigurationPage.txtServiceId.value) || 247;
                config.ExternalUrl = JellyfinSonosConfigurationPage.txtExternalUrl.value || "";
                config.SecretKey = JellyfinSonosConfigurationPage.txtSecretKey.value || "";
                console.log('[JellyfinSonos] updating config:', config);
                window.ApiClient.updatePluginConfiguration(JellyfinSonosConfigurationPage.pluginUniqueId, config).then(Dashboard.processPluginConfigurationUpdateResult);
            });

            // Disable default form submission
            return false;
        });
    </script>
</div>
</body>
</html>
